# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    name: Rust Format Check
    runs-on: [fw-builder]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy Lint
    runs-on: [fw-builder]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  build:
    name: Build
    runs-on: [fw-builder]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      # The crate is `#![no_std]` but target-agnostic — it depends only on the
      # embedded-hal traits, so it compiles for the host target and needs no
      # cross toolchain. Both feature sets are built because `embedded-hal-async`
      # pulls in a second code path.
      - name: Build (default features)
        run: cargo build --verbose

      - name: Build (all features)
        run: cargo build --verbose --all-features

  test:
    name: Cargo Test
    runs-on: [fw-builder]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      # There are no tests in the crate today. The job exists so that the first
      # one added is executed rather than silently compiled-and-ignored, which
      # is the failure mode this workflow was written to close.
      - name: Test
        run: cargo test --all-features --verbose
